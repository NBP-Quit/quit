services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - quit-noti

  notification-service:
    image: laira2/quit:notification-latest
    container_name: notification-service  # Eureka 서버는 표준 포트 유지
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_PROD_URL=${EUREKA_PROD_URL}
      - SLACK_TOKEN=${SLACK_TOKEN}
      - REDIS_HOST=localhost
      - REDIS_PORT=${REDIS_PORT}
    ports:
      - "19098:8080"
    networks:
      - quit-noti

networks:
  quit-noti:
    driver: bridge

services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - quit-network
#  eureka:
#    image: laira2/quit:eureka-server-latest
#    container_name: eureka
#    ports:
#      - "19090:8761"  # Eureka 서버는 표준 포트 유지
#    environment:
#      - SPRING_PROFILES_ACTIVE=prod
#    env_file:
#      - .env
#    networks:
#      - quit-network

  gateway:
    image: laira2/quit:gateway-server-latest
    container_name: gateway
    ports:
      - "19091:8080"  # 외부:내부
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    env_file:
      - .env
    depends_on:
      - eureka
    networks:
      - quit-network

  user:
    image: laira2/quit:user-latest
    container_name: user-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "19092:8080"
    env_file:
      - .env
    depends_on:
      - eureka
      - gateway
    networks:
      - quit-network

  store:
    image: laira2/quit:store-latest
    container_name: store-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "19093:8080"
    env_file:
      - .env
    depends_on:
      - eureka
      - gateway
      - redis
    networks:
      - quit-network

  queue:
    image: laira2/quit:queue-latest
    container_name: queue-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "19096:8080"
    env_file:
      - .env
    depends_on:
      - eureka
      - gateway
      - redis
    networks:
      - quit-network

  reservation:
    image: laira2/quit:reservation-latest
    container_name: reservation-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "19094:8080"
    env_file:
      - .env
    depends_on:
      - eureka
      - gateway
      - redis
    networks:
      - quit-network

  payment:
    image: laira2/quit:payment-latest
    container_name: payment-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "19095:8080"
    env_file:
      - .env
    depends_on:
      - eureka
      - gateway
      - redis
      - zookeeper
      - kafka
      - kafka-ui
    networks:
      - quit-network

  prometheus:
    image: prom/prometheus
    container_name: quit-prometheus-container
    ports:
      - "9090:9090"
    volumes:
      - /home/ubuntu/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always
    depends_on:
      - node_exporter

  grafana:
    image: grafana/grafana
    container_name: quit-grafana-container
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - prometheus

  node_exporter:
    image: prom/node-exporter
    container_name: quit-node-exporter-container
    ports:
      - "9100:9100"
    restart: always
    expose:
      - "9100"
    networks:
      - default

  zookeeper:
    image: wurstmeister/zookeeper:latest
    platform: linux/amd64
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: wurstmeister/kafka:latest
    platform: linux/amd64
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:29092,OUTSIDE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LISTENERS: INSIDE://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    platform: linux/amd64
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      KAFKA_CLUSTERS_0_READONLY: "false"

networks:
  quit-network :
    driver: bridge
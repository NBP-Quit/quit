services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - quit-network
  queue:
    image: laira2/quit:queue-latest
    container_name: queue-service
    build:
      context: .
      dockerfile: queue/Dockerfile
      args:
        EUREKA_PROD_URL: ${EUREKA_PROD_URL}
        REDIS_HOST: ${REDIS_HOST}
        REDIS_PORT: ${REDIS_PORT}
        REDIS_USERNAME: ${REDIS_USERNAME}
        REDIS_PASSWORD: ${REDIS_PASSWORD}
        STORE_BASEURL: ${STORE_BASEURL}
        GATEWAY_BASEURL: ${GATEWAY_BASEURL}
        FILE_DIRECTORY: ./queue-server
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "19096:8080"
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - quit-network

  user:
    image: laira2/quit:user-latest
    container_name: user-service
    build:
      context: .
      dockerfile: user/Dockerfile
      args:
        EUREKA_PROD_URL: ${EUREKA_PROD_URL}
        DATASOURCE_DRIVER_CLASS_NAME: ${DATASOURCE_DRIVER_CLASS_NAME}
        DATASOURCE_PROD_USERNAME: ${DATASOURCE_PROD_USERNAME}
        DATASOURCE_PROD_PASSWORD: ${DATASOURCE_PROD_PASSWORD}
        USER_DATASOURCE_PROD_URL: ${USER_DATASOURCE_PROD_URL}
        JWT_SECRET_KEY: ${JWT_SECRET_KEY}
        FILE_DIRECTORY: ./user
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "19092:8080"
    env_file:
      - .env
    networks:
      - quit-network

  store:
    image: laira2/quit:store-latest
    container_name: store-service
    build:
      context: .
      dockerfile: store/Dockerfile
      args:
        EUREKA_PROD_URL: ${EUREKA_PROD_URL}
        DATASOURCE_DRIVER_CLASS_NAME: ${DATASOURCE_DRIVER_CLASS_NAME}
        DATASOURCE_PROD_USERNAME: ${DATASOURCE_PROD_USERNAME}
        DATASOURCE_PROD_PASSWORD: ${DATASOURCE_PROD_PASSWORD}
        STORE_DATASOURCE_PROD_URL: ${STORE_DATASOURCE_PROD_URL}
        REDIS_HOST: ${REDIS_HOST}
        REDIS_PORT: ${REDIS_PORT}
        REDIS_USERNAME: ${REDIS_USERNAME}
        REDIS_PASSWORD: ${REDIS_PASSWORD}
        FILE_DIRECTORY: ./store
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "19093:8080"
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - quit-network

  reservation:
    image: laira2/quit:reservation-latest
    container_name: reservation-service
    build:
      context: .
      dockerfile: reservation/Dockerfile
      args:
        EUREKA_PROD_URL: ${EUREKA_PROD_URL}
        DATASOURCE_DRIVER_CLASS_NAME: ${DATASOURCE_DRIVER_CLASS_NAME}
        DATASOURCE_PROD_USERNAME: ${DATASOURCE_PROD_USERNAME}
        DATASOURCE_PROD_PASSWORD: ${DATASOURCE_PROD_PASSWORD}
        RESERVATION_DATASOURCE_PROD_URL: ${RESERVATION_DATASOURCE_PROD_URL}
        REDIS_HOST: ${REDIS_HOST}
        REDIS_PORT: ${REDIS_PORT}
        FILE_DIRECTORY: ./reservation
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "19094:8080"
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - quit-network

  payment:
    image: laira2/quit:payment-latest
    container_name: payment-service
    build:
      context: .
      dockerfile: payment/Dockerfile
      args:
        EUREKA_PROD_URL: ${EUREKA_PROD_URL}
        DATASOURCE_DRIVER_CLASS_NAME: ${DATASOURCE_DRIVER_CLASS_NAME}
        DATASOURCE_PROD_USERNAME: ${DATASOURCE_PROD_USERNAME}
        DATASOURCE_PROD_PASSWORD: ${DATASOURCE_PROD_PASSWORD}
        PAYMENT_DATASOURCE_PROD_URL: ${PAYMENT_DATASOURCE_PROD_URL}
        PAYMENT_SECRET_KEY: ${PAYMENT_SECRET_KEY}
        FILE_DIRECTORY: ./payment
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "19095:8080"
    env_file:
      - .env
    depends_on:
      - redis
      - zookeeper
      - kafka
      - kafka-ui
    networks:
      - quit-network

  zookeeper:
    image: wurstmeister/zookeeper:latest
    platform: linux/amd64
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: wurstmeister/kafka:latest
    platform: linux/amd64
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:29092,OUTSIDE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LISTENERS: INSIDE://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    platform: linux/amd64
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      KAFKA_CLUSTERS_0_READONLY: "false"

networks:
  quit-network :
    driver: bridge
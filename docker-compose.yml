version: '3.8'

services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - quit-network

  eureka:
    image: laira2/quit:eureka-latest
    container_name: eureka
    ports:
      - "8761:8761"  # Eureka 서버는 표준 포트 유지
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    env_file:
      - .env
    networks:
      - quit-network

  gateway:
    image: laira2/quit:gateway-latest
    container_name: gateway
    ports:
      - "19091:8080"  # 외부:내부
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    env_file:
      - .env
    depends_on:
      - eureka
    networks:
      - quit-network

  user:
    image: laira2/quit:user-latest
    container_name: user-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "19092:8080"
    env_file:
      - .env
    depends_on:
      - eureka
      - gateway
    networks:
      - quit-network

  store:
    image: laira2/quit:store-latest
    container_name: store-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "19093:8080"
    env_file:
      - .env
    depends_on:
      - eureka
      - gateway
      - redis
    networks:
      - quit-network

  queue:
    image: laira2/quit:queue-latest
    container_name: queue-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "19093:8080"
    env_file:
      - .env
    depends_on:
      - eureka
      - gateway
      - redis
    networks:
      - quit-network

  reservation:
    image: laira2/quit:reservation-latest
    container_name: reservation-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "19094:8080"
    env_file:
      - .env
    depends_on:
      - eureka
      - gateway
      - redis
    networks:
      - quit-network

  payment:
    image: laira2/quit:payment-latest
    container_name: payment-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "19095:8080"
    env_file:
      - .env
    depends_on:
      - eureka
      - gateway
      - -redis
    networks:
      - quit-network

  prometheus:
    image: prom/prometheus
    container_name: quit-prometheus-container
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always
    depends_on:
      - node_exporter

  grafana:
    image: grafana/grafana
    container_name: quit-grafana-container
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - prometheus

  node_exporter:
    image: prom/node-exporter
    container_name: quit-node-exporter-container
    ports:
      - "9100:9100"
    restart: always
    expose:
      - "9100"
    networks:
      - default
networks:
  quit-network :
    driver: bridge
services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - quit-network

  user:
    image: laira2/quit:user-latest
    container_name: user-service
    build:
      context: .
      dockerfile: user/Dockerfile
      args:
        EUREKA_PROD_URL: ${EUREKA_PROD_URL}
        DATASOURCE_DRIVER_CLASS_NAME: ${DATASOURCE_DRIVER_CLASS_NAME}
        DATASOURCE_PROD_USERNAME: ${DATASOURCE_PROD_USERNAME}
        DATASOURCE_PROD_PASSWORD: ${DATASOURCE_PROD_PASSWORD}
        USER_DATASOURCE_PROD_URL: ${USER_DATASOURCE_PROD_URL}
        JWT_SECRET_KEY: ${JWT_SECRET_KEY}
        FILE_DIRECTORY: ./user
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_PROD_URL=${EUREKA_PROD_URL}
      - DATASOURCE_DRIVER_CLASS_NAME=${DATASOURCE_DRIVER_CLASS_NAME}
      - DATASOURCE_PROD_USERNAME=${DATASOURCE_PROD_USERNAME}
      - DATASOURCE_PROD_PASSWORD=${DATASOURCE_PROD_PASSWORD}
      - USER_DATASOURCE_PROD_URL=${USER_DATASOURCE_PROD_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    ports:
      - "19092:8080"
    env_file:
      - .env
    networks:
      - quit-network

  store:
    image: laira2/quit:store-latest
    container_name: store-service
    build:
      context: .
      dockerfile: store/Dockerfile
      args:
        EUREKA_PROD_URL: ${EUREKA_PROD_URL}
        DATASOURCE_DRIVER_CLASS_NAME: ${DATASOURCE_DRIVER_CLASS_NAME}
        DATASOURCE_PROD_USERNAME: ${DATASOURCE_PROD_USERNAME}
        DATASOURCE_PROD_PASSWORD: ${DATASOURCE_PROD_PASSWORD}
        STORE_DATASOURCE_PROD_URL: ${STORE_DATASOURCE_PROD_URL}
        REDIS_HOST: ${REDIS_HOST}
        REDIS_PORT: ${REDIS_PORT}
        REDIS_USERNAME: ${REDIS_USERNAME}
        REDIS_PASSWORD: ${REDIS_PASSWORD}
        FILE_DIRECTORY: ./store
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_PROD_URL=${EUREKA_PROD_URL}
      - DATASOURCE_DRIVER_CLASS_NAME=${DATASOURCE_DRIVER_CLASS_NAME}
      - DATASOURCE_PROD_USERNAME=${DATASOURCE_PROD_USERNAME}
      - DATASOURCE_PROD_PASSWORD=${DATASOURCE_PROD_PASSWORD}
      - STORE_DATASOURCE_PROD_URL=${STORE_DATASOURCE_PROD_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_USERNAME=${REDIS_USERNAME}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "19093:8080"
    depends_on:
      - redis
    networks:
      - quit-network

  review:
    image: laira2/quit:review-latest
    container_name: review-service
    build:
      context: .
      dockerfile: review/Dockerfile
      args:
        EUREKA_PROD_URL: ${EUREKA_PROD_URL}
        DATASOURCE_DRIVER_CLASS_NAME: ${DATASOURCE_DRIVER_CLASS_NAME}
        DATASOURCE_PROD_USERNAME: ${DATASOURCE_PROD_USERNAME}
        DATASOURCE_PROD_PASSWORD: ${DATASOURCE_PROD_PASSWORD}
        REVIEW_DATASOURCE_PROD_URL: ${REVIEW_DATASOURCE_PROD_URL}
        REDIS_HOST: ${REDIS_HOST}
        REDIS_PORT: ${REDIS_PORT}
        RABBITMQ_HOST: ${RABBITMQ_HOST}
        RABBITMQ_PORT: ${RABBITMQ_PORT}
        RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
        RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
        S3_ACCESS_KEY: ${S3_ACCESS_KEY}
        S3_SECRET_KEY: ${S3_SECRET_KEY}
        S3_BUCKET: ${S3_BUCKET}
        FILE_DIRECTORY: ./review
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_PROD_URL=${EUREKA_PROD_URL}
      - DATASOURCE_DRIVER_CLASS_NAME=${DATASOURCE_DRIVER_CLASS_NAME}
      - DATASOURCE_PROD_USERNAME=${DATASOURCE_PROD_USERNAME}
      - DATASOURCE_PROD_PASSWORD=${DATASOURCE_PROD_PASSWORD}
      - REVIEW_DATASOURCE_PROD_URL=${REVIEW_DATASOURCE_PROD_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
    ports:
      - "19097:8080"
    depends_on:
      - redis
    networks:
      - quit-network

networks:
  quit-network :
    driver: bridge
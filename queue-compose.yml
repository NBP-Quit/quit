services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - quit-queue-network
  queue-service:
    image: laira2/quit:queue-latest
    container_name: queue-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_PROD_URL=${EUREKA_PROD_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_USERNAME=${REDIS_USERNAME}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - STORE_BASEURL=${STORE_BASEURL}
      - GATEWAY_BASEURL=${GATEWAY_BASEURL}
    ports:
      - "19096:19096"
    build:
      context: .
      dockerfile: queue/Dockerfile
      args:
        EUREKA_PROD_URL: ${EUREKA_PROD_URL}
        REDIS_HOST: ${REDIS_HOST}
        REDIS_PORT: ${REDIS_PORT}
        REDIS_USERNAME: ${REDIS_USERNAME}
        REDIS_PASSWORD: ${REDIS_PASSWORD}
        STORE_BASEURL: ${STORE_BASEURL}
        GATEWAY_BASEURL: ${GATEWAY_BASEURL}
        FILE_DIRECTORY: ./queue
    depends_on:
      - redis
    networks:
      - quit-queue-network

networks:
  quit-queue-network:
    driver: bridge
services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - quit-queue-network
  queue:
    image: laira2/quit:queue-latest
    container_name: queue-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "19096:8080"
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - quit-queue-network

networks:
  quit-queue-network:
    driver: bridge
services:
  gateway:
    image: laira2/quit:gateway-server-latest
    container_name: gateway
    build:
      context: .
      dockerfile: gateway-server/Dockerfile
      args:
        JWT_SECRET_KEY: ${JWT_SECRET_KEY}
        EUREKA_PROD_URL: ${EUREKA_PROD_URL}
        FILE_DIRECTORY: ./gateway-server
        SERVICE: "gateway"
    ports:
      - "19091:8080"  # 외부:내부
    environment:
      - SPRING_PROFILES_ACTIVE=prod
name: CI/CD

on:
  push:
    branches:
      - feat/112-quit

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ eureka-server, gateway-server, user, store, queue, reservation, payment, review ]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant with Gradle (without Test)
        run: chmod +x ./${{ matrix.service }}/gradlew

      - name: Check service folder path
        run: echo "./${{ matrix.service }}/gradlew"  # 서비스 폴더 경로 확인

      - name: Make gradlew executable for ${{ matrix.service }}
        run: chmod +x ./${{ matrix.service }}/gradlew

      - name: Update .env file
        run: |
          echo "EUREKA_PROD_URL=${{ secrets.EUREKA_PROD_URL }}" > .env
          
          echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" > .env
          
          echo "PAYMENT_SECRET_KEY=${{ secrets.PAYMENT_SECRET_KEY }}" > .env
          echo "DATASOURCE_DRIVER_CLASS_NAME=${{ secrets.DATASOURCE_DRIVER_CLASS_NAME }}" > .env
          echo "DATASOURCE_PROD_USERNAME=${{ secrets.DATASOURCE_PROD_USERNAME }}" > .env
          echo "DATASOURCE_PROD_PASSWORD=${{ secrets.DATASOURCE_PROD_PASSWORD }}" > .env
          echo "PAYMENT_DATASOURCE_PROD_URL=${{ secrets.PAYMENT_DATASOURCE_PROD_URL }}" >> .env 
          
          echo "REDIS_HOST=${{ secrets.REDIS_HOST }}" >> .env
          echo "REDIS_PORT=${{ secrets.REDIS_PORT }}" >> .env
          echo "REDIS_USERNAME=${{ secrets.REDIS_USERNAME }}" >> .env
          echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" >> .env
          echo "STORE_BASEURL=${{ secrets.STORE_BASEURL }}" >> .env
          echo "GATEWAY_BASEURL=${{ secrets.GATEWAY_BASEURL }}" >> .env
          
          echo "RESERVATION_DATASOURCE_PROD_URL=${{ secrets.RESERVATION_DATASOURCE_PROD_URL }}" > .env
          
          echo "STORE_DATASOURCE_PROD_URL=${{ secrets.STORE_DATASOURCE_PROD_URL }}" > .env
          echo "USER_DATASOURCE_PROD_URL=${{ secrets.USER_DATASOURCE_PROD_URL }}" > .env

      - name: Build with Gradle
        run: |
          cd ${{ matrix.service }} # 각 서비스 디렉토리로 이동 
          ./gradlew clean build -x test --no-daemon -Dspring.profiles.active=prod  # prod 프로파일을 명시적으로 설정
          ls 
          ls build/libs   
          cd ../

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: web docker build and push
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Give execution permission
        run: chmod +x ./dockerTagAndPush.sh

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build, Tag and Push docker image to Hub - Eureka, Gateway
        run: |
          sudo docker system prune -a
          DOCKER_BUILDKIT=0 docker compose -f eureka-server-compose.yml build --no-cache
          DOCKER_BUILDKIT=0 docker compose -f gateway-server-compose.yml build --no-cache
        env:
          EUREKA_PROD_URL: ${{ secrets.EUREKA_PROD_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}

      - name: Build, Tag and Push docker image to Hub
        run: |
          sudo docker system prune 
          DOCKER_BUILDKIT=0 docker compose -f prometheus-compose.yml build
          DOCKER_BUILDKIT=0 docker compose build
          ./dockerTagAndPush.sh
        env:
          DOCKER_HUB_NAMESPACE: ${{ secrets.DOCKER_HUB_NAMESPACE }}
          DOCKER_HUB_REPOSITORY: "quit"
          EUREKA_PROD_URL: ${{ secrets.EUREKA_PROD_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          PAYMENT_SECRET_KEY: ${{ secrets.PAYMENT_SECRET_KEY }}
          DATASOURCE_DRIVER_CLASS_NAME: ${{ secrets.DATASOURCE_DRIVER_CLASS_NAME }}
          DATASOURCE_PROD_USERNAME: ${{ secrets.DATASOURCE_PROD_USERNAME }}
          DATASOURCE_PROD_PASSWORD: ${{ secrets.DATASOURCE_PROD_PASSWORD }}
          PAYMENT_DATASOURCE_PROD_URL: ${{ secrets.PAYMENT_DATASOURCE_PROD_URL }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_USERNAME: ${{ secrets.REDIS_USERNAME }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          STORE_BASEURL: ${{ secrets.STORE_BASEURL }}
          GATEWAY_BASEURL: ${{ secrets.GATEWAY_BASEURL }}
          RESERVATION_DATASOURCE_PROD_URL: ${{ secrets.RESERVATION_DATASOURCE_PROD_URL }}
          STORE_DATASOURCE_PROD_URL: ${{ secrets.STORE_DATASOURCE_PROD_URL }}
          USER_DATASOURCE_PROD_URL: ${{ secrets.USER_DATASOURCE_PROD_URL }}

      - name: error reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v3
        with:
          name: report_files
          path: report_files_*.tar.gz

  Deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Copy Docker compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu"

      # eureka-server-compose.yml 복제
      - name: Copy Eureka compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EUREKA_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "eureka-server-compose.yml"
          target: "/home/ubuntu"

      # Gateway-server-compose.yml 복제
      - name: Copy Gateway compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GATEWAY_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "gateway-server-compose.yml"
          target: "/home/ubuntu"

      # Copy prometheus.yml to EC2
      - name: Copy prometheus.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROMETHEUS_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "prometheus.yml"
          target: "/home/ubuntu"

      # Copy prometheus-compose.yml to EC2
      - name: Copy prometheus.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROMETHEUS_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "prometheus-compose.yml"
          target: "/home/ubuntu"

      - name: Deploy Eureka to EC2  #Eureka server 배포
        uses: appleboy/ssh-action@v1.0.3
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DOCKER_HUB_NAMESPACE: ${{ secrets.DOCKER_HUB_NAMESPACE }}
        with:
          host: ${{ secrets.EUREKA_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          port: 22
          envs: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, DOCKER_HUB_NAMESPACE
          script: |
            echo ${{secrets.DOCKER_PASSWORD }} | docker login -u ${{secrets.DOCKER_USERNAME}} --password-stdin
            sudo docker-compose -f /home/ubuntu/eureka-server-compose.yml down
            sudo docker-compose -f /home/ubuntu/eureka-server-compose.yml pull
            SPRING_PROFILES_ACTIVE=prod sudo docker-compose -f /home/ubuntu/eureka-server-compose.yml --env-file /home/ubuntu/.env up -d

      - name: Deploy Gateway to EC2  #Eureka server 배포
        uses: appleboy/ssh-action@v1.0.3
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DOCKER_HUB_NAMESPACE: ${{ secrets.DOCKER_HUB_NAMESPACE }}
        with:
          host: ${{ secrets.GATEWAY_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          port: 22
          envs: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, DOCKER_HUB_NAMESPACE
          script: |
            echo ${{secrets.DOCKER_PASSWORD }} | docker login -u ${{secrets.DOCKER_USERNAME}} --password-stdin
            sudo docker-compose -f /home/ubuntu/gateway-server-compose.yml down
            sudo docker-compose -f /home/ubuntu/gateway-server-compose.yml pull
            SPRING_PROFILES_ACTIVE=prod sudo docker-compose -f /home/ubuntu/gateway-server-compose.yml --env-file /home/ubuntu/.env up -d

      - name: Deploy to EC2  #EC2 용량 증가
        uses: appleboy/ssh-action@v1.0.3
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DOCKER_HUB_NAMESPACE: ${{ secrets.DOCKER_HUB_NAMESPACE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          port: 22
          envs: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, DOCKER_HUB_NAMESPACE
          script: |
            echo ${{secrets.DOCKER_PASSWORD }} | docker login -u ${{secrets.DOCKER_USERNAME}} --password-stdin
            sudo docker-compose down
            sudo docker-compose pull
            SPRING_PROFILES_ACTIVE=prod sudo docker-compose --env-file /home/ubuntu/.env up -d

      - name: Deploy Prometheus to EC2  #Prometheus server 배포
        uses: appleboy/ssh-action@v1.0.3
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DOCKER_HUB_NAMESPACE: ${{ secrets.DOCKER_HUB_NAMESPACE }}
        with:
          host: ${{ secrets.PROMETHEUS_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          port: 22
          envs: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, DOCKER_HUB_NAMESPACE
          script: |
            echo ${{secrets.DOCKER_PASSWORD }} | docker login -u ${{secrets.DOCKER_USERNAME}} --password-stdin
            sudo docker-compose -f /home/ubuntu/prometheus-compose.yml down
            sudo docker-compose -f /home/ubuntu/prometheus-compose.yml pull
            SPRING_PROFILES_ACTIVE=prod sudo docker-compose -f /home/ubuntu/prometheus-compose.yml --env-file /home/ubuntu/.env up -d

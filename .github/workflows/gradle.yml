name: quit CI

on:
  push:
    branches:
      - feat/112-quit

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ eureka-server, gateway-server, user, store, queue, reservation, payment, review ]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant with Gradle (without Test)
        run: chmod +x ./${{ matrix.service }}/gradlew

      - name: Check service folder path
        run: echo "./${{ matrix.service }}/gradlew"  # 서비스 폴더 경로 확인

      - name: Make gradlew executable for ${{ matrix.service }}
        run: chmod +x ./${{ matrix.service }}/gradlew

      - name: Build with Gradle
        run: | 
          cd ${{ matrix.service }} # 각 서비스 디렉토리로 이동 
          ./gradlew clean build -x test --no-daemon 
          cd ../
          
  Docker:
    name: Build docker image and Push to registry
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: web docker build and push
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Give execution permission
        run: chmod +x ./dockerTagAndPush.sh

      - name: Build, Tag and Push docker image to Hub
        run: |
          docker compose build
          ./dockerTagAndPush.sh
        env:
          DOCKER_HUB_NAMESPACE: ${{ secrets.DOCKER_HUB_NAMESPACE }}
          DOCKER_HUB_REPOSITORY: "quit"

  Deploy:
    name: Deploy
    needs: Docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

# Step 1: Automatically create .env file from GitHub secrets
      - name: Create .env file
        run: |
          echo "# Environment Variables" > .env
          for secret in $(echo "$SECRETS_CONTEXT" | jq -r 'keys[]'); do
            value=$(echo "$SECRETS_CONTEXT" | jq -r --arg key "$secret" '.[$key]')
            echo "$secret=$value" >> .env
          done
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}

# Step 2: Copy Docker compose file to EC2
      - name: Copy Docker compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DOCKER_HUB_NAMESPACE: ${{ secrets.DOCKER_HUB_NAMESPACE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          port: 22
          envs: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, DOCKER_HUB_NAMESPACE
          script: |
            sudo docker-compose down
            sudo docker-compose pull
            SPRING_PROFILES_ACTIVE=prod sudo docker-compose --env-file /home/ubuntu/.env up -d
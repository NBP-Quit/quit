name: Quit CI

on:
  push:
    branches:
      - feat/112-quit

jobs:
  build-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Update .env file
        run: |
          echo "EUREKA_PROD_URL=${{ secrets.EUREKA_PROD_URL }}" > .env
          echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" > .env
          echo "PAYMENT_SECRET_KEY=${{ secrets.PAYMENT_SECRET_KEY }}" > .env
          echo "DATASOURCE_DRIVER_CLASS_NAME=${{ secrets.DATASOURCE_DRIVER_CLASS_NAME }}" > .env
          echo "DATASOURCE_PROD_USERNAME=${{ secrets.DATASOURCE_PROD_USERNAME }}" > .env
          echo "DATASOURCE_PROD_PASSWORD=${{ secrets.DATASOURCE_PROD_PASSWORD }}" > .env
          echo "PAYMENT_DATASOURCE_PROD_URL=${{ secrets.PAYMENT_DATASOURCE_PROD_URL }}" >> .env 
          echo "REDIS_HOST=${{ secrets.REDIS_HOST }}" >> .env
          echo "REDIS_PORT=${{ secrets.REDIS_PORT }}" >> .env
          echo "REDIS_USERNAME=${{ secrets.REDIS_USERNAME }}" >> .env
          echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" >> .env
          echo "STORE_BASEURL=${{ secrets.STORE_BASEURL }}" >> .env
          echo "GATEWAY_BASEURL=${{ secrets.GATEWAY_BASEURL }}" >> .env
          echo "RESERVATION_DATASOURCE_PROD_URL=${{ secrets.RESERVATION_DATASOURCE_PROD_URL }}" > .env
          echo "STORE_DATASOURCE_PROD_URL=${{ secrets.STORE_DATASOURCE_PROD_URL }}" > .env
          echo "USER_DATASOURCE_PROD_URL=${{ secrets.USER_DATASOURCE_PROD_URL }}" > .env

      - name: 도커 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: eureka 빌드
        run: |
          cd eureka-server
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon -Dspring.profiles.active=prod
          echo "========eureka========="
          cd ../

      - name: eureka 도커 이미지 빌드 & push
        run: |
          docker compose -f eureka-server-compose.yml build --no-cache
          docker push "laira2/quit:eureka-server-latest"
        env:
          EUREKA_PROD_URL: ${{ secrets.EUREKA_PROD_URL }}

      - name: gateway 빌드
        run: |
          cd gateway-server
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon -Dspring.profiles.active=prod
          echo "========gateway========="
          cd ../

      - name: gateway 도커 이미지 빌드 & push
        run: |
          docker compose -f gateway-server-compose.yml build --no-cache
          docker push "laira2/quit:gateway-server-latest"
        env:
          EUREKA_PROD_URL: ${{ secrets.EUREKA_PROD_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}

      - name: user 빌드
        run: |
          cd user
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon -Dspring.profiles.active=prod
          echo "========user========="
          ls build/libs
          cd ../

      - name: store 빌드
        run: |
          cd store
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon -Dspring.profiles.active=prod
          echo "========store========="
          ls build/libs
          cd ../

      - name: payment 빌드
        run: |
          cd payment
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon -Dspring.profiles.active=prod
          echo "========payment========="
          ls build/libs
          cd ../

      - name: queue 빌드
        run: |
          cd queue
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon -Dspring.profiles.active=prod
          echo "========queue========="
          ls build/libs
          cd ../

      - name: queue 도커 이미지 빌드 & push
        run: |
          docker compose -f queue-compose.yml build --no-cache
          docker push "laira2/quit:queue-latest"
        env:
          EUREKA_PROD_URL: ${EUREKA_PROD_URL}
          REDIS_HOST: ${REDIS_HOST}
          REDIS_PORT: ${REDIS_PORT}
          REDIS_USERNAME: ${REDIS_USERNAME}
          REDIS_PASSWORD: ${REDIS_PASSWORD}
          STORE_BASEURL: ${STORE_BASEURL}
          GATEWAY_BASEURL: ${GATEWAY_BASEURL}

      - name: reservation 빌드
        run: |
          cd reservation
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon -Dspring.profiles.active=prod
          echo "========reservation========="
          ls build/libs
          cd ../

      - name: review 빌드
        run: |
          cd review
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon -Dspring.profiles.active=prod
          echo "========review========="
          ls build/libs
          cd ../

      - name: Build, Tag and Push docker image to Hub
        run: |
          docker compose -f prometheus-compose.yml build
          docker compose build
          docker push "laira2/quit:user-latest"
          docker push "laira2/quit:store-latest"
          docker push "laira2/quit:reservation-latest"
          docker push "laira2/quit:payment-latest"
          docker push "laira2/quit:review-latest"
        env:
          DOCKER_HUB_NAMESPACE: ${{ secrets.DOCKER_HUB_NAMESPACE }}
          DOCKER_HUB_REPOSITORY: "quit"
          EUREKA_PROD_URL: ${{ secrets.EUREKA_PROD_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          PAYMENT_SECRET_KEY: ${{ secrets.PAYMENT_SECRET_KEY }}
          DATASOURCE_DRIVER_CLASS_NAME: ${{ secrets.DATASOURCE_DRIVER_CLASS_NAME }}
          DATASOURCE_PROD_USERNAME: ${{ secrets.DATASOURCE_PROD_USERNAME }}
          DATASOURCE_PROD_PASSWORD: ${{ secrets.DATASOURCE_PROD_PASSWORD }}
          PAYMENT_DATASOURCE_PROD_URL: ${{ secrets.PAYMENT_DATASOURCE_PROD_URL }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_USERNAME: ${{ secrets.REDIS_USERNAME }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          STORE_BASEURL: ${{ secrets.STORE_BASEURL }}
          GATEWAY_BASEURL: ${{ secrets.GATEWAY_BASEURL }}
          RESERVATION_DATASOURCE_PROD_URL: ${{ secrets.RESERVATION_DATASOURCE_PROD_URL }}
          STORE_DATASOURCE_PROD_URL: ${{ secrets.STORE_DATASOURCE_PROD_URL }}
          USER_DATASOURCE_PROD_URL: ${{ secrets.USER_DATASOURCE_PROD_URL }}
          REVIEW_DATASOURCE_PROD_URL: ${{ secrets.REVIEW_DATASOURCE_PROD_URL }}
          RABBITMQ_HOST: ${{ secrets.RABBITMQ_HOST }}
          RABBITMQ_PORT: ${{ secrets.RABBITMQ_PORT }}
          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}

  deploy:
    needs:
      - build-services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: AWS 인증 정보 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: actions/checkout@v4
      - name: docker-compose 복제
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu"

      - name: eureka-server-compose.yml 복제
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EUREKA_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "eureka-server-compose.yml"
          target: "/home/ubuntu"

      - name: Gateway-server-compose.yml 복제
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GATEWAY_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "gateway-server-compose.yml"
          target: "/home/ubuntu"

      - name: prometheus.yml 복제
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROMETHEUS_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "prometheus.yml"
          target: "/home/ubuntu"

      - name: prometheus-compose.yml 복제
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROMETHEUS_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "prometheus-compose.yml"
          target: "/home/ubuntu"

      - name: queue-compose.yml 복제
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.QUEUE_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "prometheus-compose.yml"
          target: "/home/ubuntu"

      - name: Eureka server 배포
        uses: appleboy/ssh-action@v1.0.3
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        with:
          host: ${{ secrets.EUREKA_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          port: 22
          envs: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
          script: |
            echo ${{secrets.DOCKER_PASSWORD }} | docker login -u ${{secrets.DOCKER_USERNAME}} --password-stdin
            sudo docker-compose -f /home/ubuntu/eureka-server-compose.yml down
            sudo docker-compose -f /home/ubuntu/eureka-server-compose.yml pull
            SPRING_PROFILES_ACTIVE=prod sudo docker-compose -f /home/ubuntu/eureka-server-compose.yml up -d

      - name:  gateway server 배포
        uses: appleboy/ssh-action@v1.0.3
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        with:
          host: ${{ secrets.GATEWAY_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          port: 22
          envs: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
          script: |
            echo ${{secrets.DOCKER_PASSWORD }} | docker login -u ${{secrets.DOCKER_USERNAME}} --password-stdin
            sudo docker-compose -f /home/ubuntu/gateway-server-compose.yml down
            sudo docker-compose -f /home/ubuntu/gateway-server-compose.yml pull
            SPRING_PROFILES_ACTIVE=prod sudo docker-compose -f /home/ubuntu/gateway-server-compose.yml up -d

      - name: Queue 배포
        uses: appleboy/ssh-action@v1.0.3
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        with:
          host: ${{ secrets.QUEUE_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          port: 22
          envs: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
          script: |
            echo ${{secrets.DOCKER_PASSWORD }} | docker login -u ${{secrets.DOCKER_USERNAME}} --password-stdin
            sudo docker-compose -f /home/ubuntu/queue-compose.yml down
            sudo docker-compose -f /home/ubuntu/queue-compose.yml pull
            SPRING_PROFILES_ACTIVE=prod sudo docker-compose -f /home/ubuntu/queue-compose.yml up -d

      - name: Deploy to EC2  #EC2 용량 증가
        uses: appleboy/ssh-action@v1.0.3
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DOCKER_HUB_NAMESPACE: ${{ secrets.DOCKER_HUB_NAMESPACE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          port: 22
          envs: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, DOCKER_HUB_NAMESPACE
          script: |
            echo ${{secrets.DOCKER_PASSWORD }} | docker login -u ${{secrets.DOCKER_USERNAME}} --password-stdin
            sudo docker-compose down
            sudo docker-compose pull
            SPRING_PROFILES_ACTIVE=prod sudo docker-compose up -d

      - name: Prometheus server 배포
        uses: appleboy/ssh-action@v1.0.3
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        with:
          host: ${{ secrets.PROMETHEUS_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          port: 22
          envs: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
          script: |
            echo ${{secrets.DOCKER_PASSWORD }} | docker login -u ${{secrets.DOCKER_USERNAME}} --password-stdin
            sudo docker-compose -f /home/ubuntu/prometheus-compose.yml down
            sudo docker-compose -f /home/ubuntu/prometheus-compose.yml pull
            SPRING_PROFILES_ACTIVE=prod sudo docker-compose -f /home/ubuntu/prometheus-compose.yml up -d

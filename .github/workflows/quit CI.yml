name: Quit CI

on:
  push:
    branches:
      - feat/112-quit

jobs:
  build-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Update .env file
        run: |
          echo "EUREKA_PROD_URL=${{ secrets.EUREKA_PROD_URL }}" > .env
          echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" > .env
          echo "PAYMENT_SECRET_KEY=${{ secrets.PAYMENT_SECRET_KEY }}" > .env
          echo "DATASOURCE_DRIVER_CLASS_NAME=${{ secrets.DATASOURCE_DRIVER_CLASS_NAME }}" > .env
          echo "DATASOURCE_PROD_USERNAME=${{ secrets.DATASOURCE_PROD_USERNAME }}" > .env
          echo "DATASOURCE_PROD_PASSWORD=${{ secrets.DATASOURCE_PROD_PASSWORD }}" > .env
          echo "PAYMENT_DATASOURCE_PROD_URL=${{ secrets.PAYMENT_DATASOURCE_PROD_URL }}" >> .env 
          echo "REDIS_HOST=${{ secrets.REDIS_HOST }}" >> .env
          echo "REDIS_PORT=${{ secrets.REDIS_PORT }}" >> .env
          echo "REDIS_USERNAME=${{ secrets.REDIS_USERNAME }}" >> .env
          echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" >> .env
          echo "STORE_BASEURL=${{ secrets.STORE_BASEURL }}" >> .env
          echo "GATEWAY_BASEURL=${{ secrets.GATEWAY_BASEURL }}" >> .env
          echo "RESERVATION_DATASOURCE_PROD_URL=${{ secrets.RESERVATION_DATASOURCE_PROD_URL }}" > .env
          echo "STORE_DATASOURCE_PROD_URL=${{ secrets.STORE_DATASOURCE_PROD_URL }}" > .env
          echo "USER_DATASOURCE_PROD_URL=${{ secrets.USER_DATASOURCE_PROD_URL }}" > .env

      - name: eureka 빌드
        run: |
          cd eureka-server
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon -Dspring.profiles.active=prod
          echo "========eureka========="
          ls build/libs
          cd ../

      - name: gateway 빌드
        run: |
          cd gateway-server
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon -Dspring.profiles.active=prod
          echo "========gateway========="
          ls build/libs
          cd ../

      - name: user 빌드
        run: |
          cd user
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon -Dspring.profiles.active=prod
          echo "========user========="
          ls build/libs
          cd ../

      - name: store 빌드
        run: |
          cd store
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon -Dspring.profiles.active=prod
          echo "========store========="
          ls build/libs
          cd ../

      - name: payment 빌드
        run: |
          cd payment
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon -Dspring.profiles.active=prod
          echo "========payment========="
          ls build/libs
          cd ../

      - name: queue 빌드
        run: |
          cd queue
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon -Dspring.profiles.active=prod
          echo "========queue========="
          ls build/libs
          cd ../

      - name: reservation 빌드
        run: |
          cd reservation
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon -Dspring.profiles.active=prod
          echo "========reservation========="
          ls build/libs
          cd ../

      - name: review 빌드
        run: |
          cd review
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon -Dspring.profiles.active=prod
          echo "========review========="
          ls build/libs
          cd ../

  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: AWS 인증 정보 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Give execution permission
        run: chmod +x ./dockerTagAndPush.sh

      - name: 도커 허브 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: eureka 도커 이미지 빌드 & push
        run: |
          docker compose -f eureka-server-compose.yml build --no-cache
        env:
          EUREKA_PROD_URL: ${{ secrets.EUREKA_PROD_URL }}


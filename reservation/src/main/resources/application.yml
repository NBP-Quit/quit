server:
  port: 19094

spring:
  application:
    name: reservation
  jpa:
    show-sql: true
    database: postgresql
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA_SERVER}
    consumer:
      auto-offset-reset: earliest
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  datasource:
    driver-class-name: ${DATASOURCE_DRIVER_CLASS_NAME}
    username: ${DATASOURCE_PROD_USERNAME}
    password: ${DATASOURCE_PROD_PASSWORD}
    url: ${RESERVATION_DATASOURCE_PROD_URL}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_PROD_URL}

management:
  endpoints:
    web:
      exposure:
        include: prometheus
resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 5
        slow-call-rate-threshold: 100
        slow-call-duration-threshold: 30000
        failure-rate-threshold: 50
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 10s
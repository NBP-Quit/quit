services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - quit-network
  store-service:
    image: laira2/quit:store-latest
    container_name: store-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_PROD_URL=${EUREKA_PROD_URL}
      - DATASOURCE_DRIVER_CLASS_NAME=${DATASOURCE_DRIVER_CLASS_NAME}
      - DATASOURCE_PROD_USERNAME=${DATASOURCE_PROD_USERNAME}
      - DATASOURCE_PROD_PASSWORD=${DATASOURCE_PROD_PASSWORD}
      - STORE_DATASOURCE_PROD_URL=${STORE_DATASOURCE_PROD_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT}
      - QUEUE_FEIGN_URL=${QUEUE_FEIGN_URL}
      - KAFKA_SERVER=${KAFKA_SERVER}
    ports:
      - "19093:19093"
    depends_on:
      - redis
    networks:
      - quit-network

networks:
  quit-network :
    driver: bridge
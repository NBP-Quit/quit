server:
  port: 19091

spring:
  application:
    name: gateway-server

  main:
    web-application-type: reactive
  data:
    redis:
      host: ${REDIS_HOST}

      port: ${REDIS_PORT}
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**, /api/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
        - id: queue-service
          uri: lb://queue-service
          predicates:
            - Path=/api/queues, /api/queues/**

        - id: reservation-service
          uri: lb://reservation-service
          predicates:
            - Path=/api/reservations, /api/reservations/**
        - id: review-service
          uri: lb://review-service
          predicates:
            - Path=/api/stores/{storeId}/reviews/**, /api/stores/{storeId}/reservations/{reservationId}/reviews/**
        - id: store-service
          uri: lb://store-service
          predicates:
            - Path=/api/stores/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**



eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_PROD_URL}

logging:
  level:
    org:
      springframework:
        cloud:
          gateway: DEBUG

jwt:
  secret:
    key: ${JWT_SECRET_KEY}
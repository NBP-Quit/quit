server:
  port: 19091

spring:
  application:
    name: gateway-server

  main:
    web-application-type: reactive

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**, /api/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
        - id: queue
          uri: lb://queue
          predicates:
            - Path=/api/queues, /api/queues/**
        - id: reservation
          uri: lb://reservation
          predicates:
            - Path=/api/reservations, /api/reservations/**
        - id: review
          uri: lb://review
          predicates:
            - Path=/api/stores/{storeId}/reviews/**, /api/stores/{storeId}/reservations/{reservationId}/reviews/**
        - id: store
          uri: lb://store
          predicates:
            - Path=/api/stores/**
        - id: payment
          uri: lb://payment
          predicates:
            - Path=/api/payments/**
           
eureka:
  client:
    service-url:
      defaultZone: http://3.15.206.155:19090/eureka/

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    com.netflix.eureka: DEBUG
    com.netflix.discovery: DEBUG


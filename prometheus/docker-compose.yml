services:
  prometheus:
    image: prom/prometheus
    container_name: quit-prometheus-container
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always

  grafana:
    image: grafana/grafana
    container_name: quit-grafana-container
    ports:
      - "3000:3000"
    restart: always
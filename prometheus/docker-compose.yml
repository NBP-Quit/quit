services:
  prometheus:
    image: prom/prometheus
    container_name: quit-prometheus-container
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always
    depends_on:
      - node_exporter

  grafana:
    image: grafana/grafana
    container_name: quit-grafana-container
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - prometheus

  node_exporter:
    image: prom/node-exporter
    container_name: quit-node-exporter-container
    ports:
      - "9100:9100"
    restart: always
    expose:
      - "9100"
    networks:
      - default
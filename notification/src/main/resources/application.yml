spring:
  application:
    name: notification
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
server:
  port: 19098
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_PROD_URL}
slack:
  token: ${SLACK_TOKEN}

logging:
  level:
    com.netflix.eureka: DEBUG
    com.netflix.discovery: DEBUG
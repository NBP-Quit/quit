services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - quit-network

  review-service:
    image: laira2/quit:review-latest
    container_name: review-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_PROD_URL=${EUREKA_PROD_URL}
      - DATASOURCE_DRIVER_CLASS_NAME=${DATASOURCE_DRIVER_CLASS_NAME}
      - DATASOURCE_PROD_USERNAME=${DATASOURCE_PROD_USERNAME}
      - DATASOURCE_PROD_PASSWORD=${DATASOURCE_PROD_PASSWORD}
      - REVIEW_DATASOURCE_PROD_URL=${REVIEW_DATASOURCE_PROD_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
    ports:
      - "19097:19097"
    depends_on:
      - redis
    networks:
      - quit-network

networks:
  quit-network:
    driver: bridge
services:
  zookeeper:
    image: wurstmeister/zookeeper:latest
    platform: linux/amd64
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: wurstmeister/kafka:latest
    platform: linux/amd64
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:29092,OUTSIDE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LISTENERS: INSIDE://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    platform: linux/amd64
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      KAFKA_CLUSTERS_0_READONLY: "false"

  payment:
    image: laira2/quit:payment-latest
    container_name: payment-service
    build:
      context: payment
      dockerfile: payment/Dockerfile
      args:
        EUREKA_PROD_URL: ${EUREKA_PROD_URL}
        DATASOURCE_DRIVER_CLASS_NAME: ${DATASOURCE_DRIVER_CLASS_NAME}
        DATASOURCE_PROD_USERNAME: ${DATASOURCE_PROD_USERNAME}
        DATASOURCE_PROD_PASSWORD: ${DATASOURCE_PROD_PASSWORD}
        PAYMENT_DATASOURCE_PROD_URL: ${PAYMENT_DATASOURCE_PROD_URL}
        PAYMENT_SECRET_KEY: ${PAYMENT_SECRET_KEY}
        FILE_DIRECTORY: ./payment
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_PROD_URL=${EUREKA_PROD_URL}
      - DATASOURCE_DRIVER_CLASS_NAME=${DATASOURCE_DRIVER_CLASS_NAME}
      - DATASOURCE_PROD_USERNAME=${DATASOURCE_PROD_USERNAME}
      - DATASOURCE_PROD_PASSWORD=${DATASOURCE_PROD_PASSWORD}
      - PAYMENT_DATASOURCE_PROD_URL=${PAYMENT_DATASOURCE_PROD_URL}
      - PAYMENT_SECRET_KEY=${PAYMENT_SECRET_KEY}
    ports:
      - "19095:8080"
    depends_on:
      - redis
      - zookeeper
      - kafka
      - kafka-ui

server:
  port: 19092

spring:
  application:
    name: user-service
  datasource:
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
    username: ${SPRING_DATASOURCE_LOCAL_USERNAME}
    password: ${SPRING_DATASOURCE_LOCAL_PASSWORD}
    url: ${SPRING_DATASOURCE_LOCAL_URL}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 1000
      open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL}

jwt:
  access-expiration: "#{60 * 60 * 1000}"
  secret-key: ${JWT_SECRET_KEY}

logging:
  level:
    org:
      springframework:
        security=DEBUG:

management:
  endpoints:
    web:
      exposure:
        include: prometheus
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${REVIEW_DB_PROD_URL}
    username: ${REVIEW_DB_PROD_USERNAME}
    password: ${REVIEW_DB_PROD_PASSWORD}
    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      open-in-view: false
      properties:
        hibernate:
          show_sql: true
          format_sql: true
          highlight_sql: true
          default_batch_fetch_size: 100
    servlet:
      multipart:
        max-file-size: 100MB
        max-request-size: 100MB
    data:
      redis:
        host: ${REDIS_HOST}
        port: ${REDIS_PORT}
    rabbitmq:
      host: ${RABBITMQ_HOST}
      port: ${RABBITMQ_PORT}
      username: ${RABBITMQ_USERNAME}
      password: ${RABBITMQ_PASSWORD}
  message:
    exchange: likeExchange
    queue: likeQueue
    routing-key: like.routing.key
  server:
    port: 19096
  eureka:
    client:
      service-url:
        defaultZone: ${EUREKA_PROD_URL}
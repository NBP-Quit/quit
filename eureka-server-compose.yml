services:
  eureka:
    image: laira2/quit:eureka-server-latest
    container_name: eureka
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
      args:
        EUREKA_PROD_URL: ${EUREKA_PROD_URL}
        FILE_DIRECTORY: ./eureka-server
        SERVICE: "eureka"
    ports:
      - "19090:8761"  # Eureka 서버는 표준 포트 유지
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_PROD_URL=${EUREKA_PROD_URL}
    env_file:
      - .env


services:
  eureka:
    image: laira2/quit:eureka-server-latest
    container_name: eureka
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
      args:
        EUREKA_PROD_URL: ${EUREKA_PROD_URL}
        EUREKA_EC2_HOST: ${EUREKA_EC2_HOST}
        FILE_DIRECTORY: ./eureka-server
        SERVICE: "eureka"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_PROD_URL=${EUREKA_PROD_URL}
      - EUREKA_EC2_HOST=${EUREKA_EC2_HOST}
    env_file:
      - .env
    networks:
      - host
networks:
  host:
    external: true
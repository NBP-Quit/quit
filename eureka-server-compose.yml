services:
  eureka:
    image: laira2/quit:eureka-server-latest
    container_name: eureka
    ports:
      - "19090:8761"  # Eureka 서버는 표준 포트 유지
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    env_file:
      - .env

  gateway:
    image: laira2/quit:gateway-server-latest
    container_name: gateway
    ports:
      - "19091:8080"  # 외부:내부
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    env_file:
      - .env
    depends_on:
      - eureka


